name: Crypto Predictor

on:
  workflow_dispatch:

# Needed only by the dashboard step at the very end, which commits
# dashboard/equity_data.js. Collection itself writes nothing to the repo.
permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests gspread google-auth cryptography numpy

      # --- spending gate ---------------------------------------------------
      # Scans the files this workflow can execute for anything that could place
      # a Kalshi order. live.py contains an order path, so the guard is told
      # that is known and intended; what actually prevents betting is
      # LIVE_TRADING being "0" below AND the Control tab reading HALTED.
      - name: No-trade guard
        env:
          ALLOW_LIVE_TRADING: "1"
        run: python no_trade_guard.py

      - name: Generate predictions
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          # NO PUSHOVER CREDENTIALS. Not merely "alerts off" -- the tokens are
          # not present, so no code path reachable from this scheduled job can
          # send a notification even if a flag were wrong. Removed after the
          # hourly pulse kept firing while every flag said it would not.
          # Still logging the order each signal WOULD send.
          DRY_RUN_ORDERS: "1"
          # PHONE ALERTS. OFF alongside live betting. An alert that names a
          # bet is a prompt to place one by hand, and there is no longer a
          # reason to place one: the edge it was naming does not survive
          # being scored the way Kalshi settles. Silent collection continues.
          BET_ALERTS: "0"
          ALERT_STAKE: "5"
          ALERT_TZ: "America/Chicago"
          # Waking hours only. Overnight windows are still collected and
          # graded; they just do not buzz.
          ALERT_HOUR_START: "7"
          ALERT_HOUR_END: "22"
          # CASH-OUT DATA -- OFF. It sleeps until +10 minutes, which made every
          # run take ten minutes instead of ninety seconds, and while it sat
          # ahead of the betting step it pushed every bet ten minutes into its
          # window. The ordering is fixed, but the sleep still delays every
          # answer about what a window did, and 163 rows already say the
          # hold-versus-sell difference is nowhere near significant.
          MEASURE_MIDWINDOW: "0"
          # BETTING IS HALTED. Turned off 2026-09-18 after re-scoring the
          # forward test the way Kalshi actually settles, and left off after
          # the 21 Sep live tests lost about $50 across ~20 bets.
          #
          # v6_regrade.py has since re-scored it against Kalshi's own result
          # field rather than our spot-vs-strike arithmetic: -$0.07 a bet
          # over 2,375 bets, 95% CI -0.88 to +0.74. Not the -$402 previously
          # reported -- about 60% of that was a grading artifact -- but still
          # indistinguishable from zero, and the +2.3pp gross edge at 40-60c
          # is roughly the size of the fee.
          #
          # Do NOT set this back to "1" until a rule has been shown to beat
          # the market's own price on the STRIKE question, out of sample,
          # after fees. Eleven strategies have now failed that test.
          LIVE_TRADING: "0"
          ALLOW_LIVE_TRADING: "0"
          # Confirmed against a real fill: DOWN sends an ask, which opens a
          # NO position. Kalshi's own order history reads "Sold Yes".
          LIVE_ALLOW_DOWN: "1"
          # OFF. This measured whether the edge survived the 3-4 minute entry a
          # BOT would have been stuck with. Set back to "1" if automated
          # betting ever becomes possible.
          MEASURE_ENTRY_DECAY: "0"
          # PRICE PATH. On. Samples every coin's market every 30 seconds for
          # the first 13.5 minutes of the window -- the data behind the maker
          # study and every order-book experiment since.
          #
          # It makes this job run almost the full 15 minutes, so runs now
          # overlap slightly. That is safe: the workflow declares no
          # concurrency group, so a long run is neither cancelled nor able to
          # block the next one, and the path sampling is the LAST thing the
          # job does -- every signal row is written long before it starts.
          MEASURE_PATH: "1"
        run: python predictor.py
      - name: Resolve outcomes
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python predictor.py --resolve
      - name: Refresh Report tab
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python predictor.py --report --sheet

      # The hourly pulse used to live here. It called live.pulse() inline via
      # `python -c "import predictor as P, live; ..."`, which is why grepping
      # .py files for callers and workflow files for "live.py" both found
      # nothing while it kept firing every hour. Deleted, not disabled.

      # --- dashboard data -------------------------------------------------
      # LAST, and continue-on-error, so nothing below can affect collection.
      - name: Rebuild dashboard data
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        # EVERY window, not just the top of the hour. Rebuilding is free --
        # it runs on GitHub, and this repo is public so the minutes are not
        # metered -- while publishing to claude.ai costs a model session. So
        # the numbers stay current at no cost and the published pages are
        # refreshed deliberately, when there is something worth reading.
        run: |
          python dashboard_data.py
          python path_data.py || echo "path payload skipped"
          if git diff --quiet -- dashboard/equity_data.js dashboard/path_data.js; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/equity_data.js dashboard/path_data.js
          git commit -m "Refresh dashboard data [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin claude/meme-coin-scanner-fixes-uai1dj && \
            git push origin HEAD:claude/meme-coin-scanner-fixes-uai1dj && exit 0
            echo "push failed, retrying in $((2**i))s"; sleep $((2**i))
          done
          echo "could not push dashboard data after 3 attempts"
