name: Trailing-Stop Backtest

on:
  workflow_dispatch:
    inputs:
      tab:
        description: 'Which tab to analyze'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - sheet1
          - dip

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python backtest.py --tab ${{ inputs.tab || 'both' }}
