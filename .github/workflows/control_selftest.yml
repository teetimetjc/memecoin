name: Control

# The betting switch, and the proof that it works.
#
#   action: selftest (default) -- reads the Control tab and the balance, runs
#     the funding check, HALTS, confirms the halt stuck, resumes, and sends one
#     real Pushover notification so the alert path is proven.
#   action: run   -- set the Control tab to RUNNING. Betting may resume at the
#     next 15-minute window.
#   action: halt  -- set it to HALTED. Betting stops at the next window.
#   stake: <n>    -- write a new per-bet stake instead.
#
# Manual only. None of these place an order: control.py issues one signed GET
# for the balance and otherwise touches only the spreadsheet.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "selftest | run | halt"
        required: false
        default: "selftest"
      stake:
        description: "Dollars per bet (overrides action when set)"
        required: false
        default: ""

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests gspread google-auth cryptography

      - name: Control
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          if [ -n "${{ inputs.stake }}" ]; then
            python control.py --stake "${{ inputs.stake }}"
          elif [ "${{ inputs.action }}" = "run" ]; then
            python control.py --run
          elif [ "${{ inputs.action }}" = "halt" ]; then
            python control.py --halt
          else
            python control.py
          fi
