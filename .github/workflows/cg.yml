name: CG Experiments (read-only)

# The numbered experiments from the external review. Each one reads the
# sheet, prints a result, and writes nothing.
#
# CG0 is not here: it is the settlement fetch, which writes a tab, and it
# lives in settle_fetch.yml. CG1 through CG5 depend on it having run,
# because they all need a settlement outcome that is not our own
# arithmetic.
#
# CG7 and CG9 do NOT depend on it, and that is the point of them: one asks
# whether YES and NO can both be bought for under a dollar, the other
# whether a contract's price move predicts its next price move. Neither
# uses a settlement outcome at all, so neither could have been damaged by
# the flag that turned out to be 19% wrong.
#
# v6 is the re-grade of the original forward test against that same
# authoritative result. It is the one case here that writes anything: it
# tops up the Settled tab before scoring, because a re-grade run against a
# half-filled tab silently drops the oldest signals and reports what is
# left as though it were the whole sample.
#
# Read-only otherwise -- no order path is reachable from this workflow.

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'cg1 (calibration) | cg7 (yes+no arbitrage) | cg9 (book momentum) | v6 (re-grade the forward test)'
        required: true
        default: 'cg7'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography
      - name: Run the experiment
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: |
          case "${{ inputs.experiment }}" in
            cg1) python cg1.py ;;
            cg7) python cg7.py ;;
            cg9) python cg9.py ;;
            all) python cg7.py; echo; python cg9.py ;;
            v6)  python settle_fetch.py; echo; python v6_regrade.py ;;
            *)   echo "unknown experiment: ${{ inputs.experiment }}"; exit 1 ;;
          esac
