name: Depth check at T-9 (read-only)

# goldoil put WTI at +3.56% in the band, positive in both halves. That is a
# QUOTE result: it says the price was wrong, not that six contracts could be
# bought at it. This samples the real book at the entry offset, for the two
# candidates and for the five live series in the same minutes.
#
# Its own concurrency group, so it can never queue behind or displace the
# live betting session. Places no order, cancels no order.

on:
  workflow_dispatch:
  # SCHEDULE OFF, 2026-11-05, at the account holder's request.
  # This existed to vet WTI and GOLD before any money went near them:
  # oil backtested +3.56% in the 90-96c band on QUOTES, and the only
  # open question was whether six contracts sit at the ask. Oil's live
  # session has now been retired, so the answer would not be acted on,
  # and a collector nobody will read is just noise in the Actions log.
  # workflow_dispatch still works if oil is ever reconsidered.
  # schedule:
  # - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: depthchk
  cancel-in-progress: false

jobs:
  depthchk:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography
      - name: Sample the book at T-9
        env:
          PYTHONUNBUFFERED: '1'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: python depthchk.py 3300
