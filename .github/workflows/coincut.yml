name: The live record by coin (read-only)

# Every report so far has cut the record by strategy, band, stake and hour --
# never by underlying. This closes that hole, on real fills and real
# settlements rather than quotes, because what killed T-3 and oil was never
# visible in quotes.
#
# It reads the sheet and the portfolio endpoints only, so it stays quiet
# enough to run alongside the live trader.
#
# Read-only. Places no order, writes no row, changes no setting.

on:
  workflow_dispatch:
    inputs:
      stakes:
        description: 'Stakes to include, comma separated. Empty = all.'
        required: false
        default: '4,5'

permissions:
  contents: read

jobs:
  coincut:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography
      - name: Cut the live record by coin
        env:
          PYTHONUNBUFFERED: '1'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          COINCUT_STAKES: ${{ inputs.stakes }}
        run: python coincut.py
