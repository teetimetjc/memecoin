name: Bounce Exit Test

# Small real-money trades, by hand. Started as a mechanical test of the
# resting sell and now also runs the combo rule sets.
#
# Live trading is HALTED globally. This job switches it on for itself alone --
# the predictor workflow is untouched and stays halted, so nothing else can
# place an order because this ran. Path sampling and every other collector
# keep running whether or not this workflow is used; stopping it stops
# SPENDING, not data.
#
# It refuses without the confirmation input, and the script refuses again on
# its own. Two locks, because this spends real money.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to place real trades'
        required: true
        default: ''
      windows:
        description: 'How many 15-min windows to wait for a setup'
        required: false
        default: '8'
      stake:
        description: 'Dollars per bet. Blank = 5. Smaller buys more bets from the same ceiling.'
        required: false
        default: ''
      buy_until:
        description: 'Stop BUYING after this UTC time, YYYY-MM-DDTHH:MM. Blank = no time limit.'
        required: false
        default: ''
      max_spend:
        description: 'Total dollars this run may commit. 0 = no cap (single supervised trade only).'
        required: false
        default: '0'
      combo:
        description: '1 = six high-ROI rules. plan = 10-20c 3x + 20-40c 2x. cheap = 10-20c only. sub10 = under 10c, held to settlement. Blank = champion.'
        required: false
        default: ''
      max_take:
        description: 'Cap the take-profit, e.g. 2.5. Ignored by sub10, which never sells. 0 = each rule keeps its own.'
        required: false
        default: '0'
      pulse:
        description: 'Set to 1 for an hourly summary notification (fills, stake, balance). No per-bet alerts.'
        required: false
        default: ''
      min_entry:
        description: 'Cheapest entry allowed, in cents. Blank = 20. Use 10 for the cheap band, 2 for sub10.'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'RUN'
    # Long enough to sit through the windows a deadline run spans. Runner
    # minutes are free on a public repo.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests gspread google-auth cryptography

      - name: Place the trades
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_KEY_ID:  ${{ secrets.KALSHI_KEY_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          # Only read by the hourly pulse. Nothing here sends a bet alert.
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY:  ${{ secrets.PUSHOVER_USER_KEY }}
          # On for this job ONLY. predictor.yml keeps its own "0".
          LIVE_TRADING: "1"
          ALLOW_LIVE_TRADING: "1"
          LIVE_ALLOW_DOWN: "1"
          # Two gates, both checked in the SECOND before an order is signed.
          # The deadline bounds WHEN it may buy; the ceiling bounds HOW MUCH.
          # Either one alone unlocks more than a single trade, and neither
          # can be outrun by a job that hangs, retries, or is dispatched
          # twice. The ceiling is the stricter of the two, since a busy
          # afternoon cannot spend past it the way it can outpace a clock.
          #
          # sub10 fires about 80 times a day, so the ceiling is the only
          # thing standing between a quiet afternoon and heavy turnover.
          BUY_UNTIL_UTC: ${{ inputs.buy_until }}
          MAX_SPEND_USD: ${{ inputs.max_spend }}
          COMBO: ${{ inputs.combo }}
          MAX_TAKE: ${{ inputs.max_take }}
          BOUNCE_PULSE: ${{ inputs.pulse }}
          # Dollars per bet. At the cheap end this is a bigger position than
          # it sounds: $5 at 4.5c is 111 contracts, which pays $111.
          STAKE_USD: ${{ inputs.stake }}
          # live.py refuses anything under this, LOCALLY, before the order is
          # sent -- and reports it exactly like a market that moved away. At
          # the 20c default that silently refuses every cheap setup, which is
          # where the evidence actually lives. A cheap run must set 10, and a
          # sub10 run must set 2, or it will place nothing and look unlucky.
          MIN_ENTRY_CENTS: ${{ inputs.min_entry }}
        run: python bounce_live_test.py RUN-ONE-FIVE-DOLLAR-TEST ${{ inputs.windows }}
