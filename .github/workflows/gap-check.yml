name: Gap Check (read-only)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours of history to replay"
        required: false
        default: "12"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: Replay the gap
        run: python gap_check.py "${{ inputs.hours }}"
