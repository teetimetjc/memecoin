name: Three untested patterns (read-only)

# Coin, correlated legs, and fill speed -- the three questions left after
# hour-of-day, underlying volatility and the contract price path all came
# back empty.
#
# Reads the Live Bets sheet, the fills and the settlements. Places no order,
# cancels no order, writes no sheet.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography
      - name: Test coin, legs and fill speed
        env:
          PYTHONUNBUFFERED: '1'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: python patterns.py
