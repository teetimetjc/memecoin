name: Crypto Predictor

on:
  workflow_dispatch:

# Needed only by the dashboard step at the very end, which commits
# dashboard/equity_data.js. Collection itself writes nothing to the repo.
permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests gspread google-auth cryptography

      # --- spending gate ---------------------------------------------------
      # Scans the files this workflow can execute for anything that could place
      # a Kalshi order. live.py contains an order path, so the guard is told
      # that is known and intended; what actually prevents betting is
      # LIVE_TRADING being "0" below AND the Control tab reading HALTED.
      - name: No-trade guard
        env:
          ALLOW_LIVE_TRADING: "1"
        run: python no_trade_guard.py

      - name: Generate predictions
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          # Still logging the order each signal WOULD send.
          DRY_RUN_ORDERS: "1"
          # PHONE ALERTS. The order API cannot trade from here -- every order
          # is refused with market_not_found for markets that are live and
          # priced -- so the bot names the bets and a human places them in the
          # Kalshi app. Fires ~35 seconds into the window, which is the entry
          # the whole history is priced at.
          BET_ALERTS: "1"
          ALERT_STAKE: "5"
          ALERT_TZ: "America/Chicago"
          # Waking hours only. Overnight windows are still collected and
          # graded; they just do not buzz.
          ALERT_HOUR_START: "7"
          ALERT_HOUR_END: "22"
          # CASH-OUT DATA. Read-only: samples what each bet could be SOLD for
          # at +5 and +10 minutes, so the early-exit question can be settled
          # with numbers instead of instinct. Adds ~10 minutes to each run,
          # and runs after the alert so it can never delay it.
          MEASURE_MIDWINDOW: "1"
          # BETTING IS LIVE. Turned on 18 Sep after the exchange_index bug was
          # found and a real order filled at the 35-second entry: SOL DOWN,
          # 10 contracts at 45.8c against a 47c quote, on the correct side
          # (confirmed "Sold Yes" in the app).
          #
          # $5 a bet, every qualifying signal, no per-window cap.
          #
          # TO STOP IT: run the "Control" workflow with action: halt. That is
          # one action from a phone and takes effect on the next window. It
          # does not need a code change and it does not need me.
          LIVE_TRADING: "1"
          ALLOW_LIVE_TRADING: "1"
          # Confirmed against a real fill: DOWN sends an ask, which opens a
          # NO position. Kalshi's own order history reads "Sold Yes".
          LIVE_ALLOW_DOWN: "1"
          # OFF. This measured whether the edge survived the 3-4 minute entry a
          # BOT would have been stuck with. Bets are now placed by hand from
          # the phone alert at ~35 seconds -- the entry the history is already
          # priced at -- so there is no delay left to measure. It also slept
          # four minutes on every run. Set back to "1" if automated betting
          # ever becomes possible.
          MEASURE_ENTRY_DECAY: "0"
        run: python predictor.py
      - name: Resolve outcomes
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python predictor.py --resolve
      - name: Refresh Report tab
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python predictor.py --report --sheet

      # --- hourly pulse ----------------------------------------------------
      # One summary per hour, not one message per bet. Rides on this workflow
      # because this repo's cron never fires but this workflow demonstrably
      # runs every 15 minutes.
      - name: Hourly pulse
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          if [ "$(date -u +%M)" -ge 15 ]; then
            echo "Not the top of the hour; no pulse."
            exit 0
          fi
          python -c "import predictor as P, live; live.pulse(P._get_client())"

      # --- dashboard data -------------------------------------------------
      # LAST, and continue-on-error, so nothing below can affect collection.
      # Only on the hour, to keep repo churn sane.
      - name: Rebuild dashboard data
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ "$(date -u +%M)" -ge 15 ]; then
            echo "Not the top of the hour; skipping dashboard rebuild."
            exit 0
          fi
          python dashboard_data.py
          if git diff --quiet -- dashboard/equity_data.js; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/equity_data.js
          git commit -m "Refresh dashboard data [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin claude/meme-coin-scanner-fixes-uai1dj && \
            git push origin HEAD:claude/meme-coin-scanner-fixes-uai1dj && exit 0
            echo "push failed, retrying in $((2**i))s"; sleep $((2**i))
          done
          echo "could not push dashboard data after 3 attempts"
