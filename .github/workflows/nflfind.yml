name: Find a league's game series on Kalshi (read-only)

# Which series actually carries game winners, proven by what its markets
# say rather than by what it is called. The probe listed 15,581 series and
# a keyword filter on "GAME" returned GAMEAWARDS and KXAFLGAME -- Australian
# football, which would have looked exactly right to a name matcher. And
# KXEFOOTBALLGAME is a VIDEO GAME league whose markets read "Seattle (Knox)
# wins". The NBA 2K equivalent will pass every name test too, which is why
# this prints sample titles for a human to read instead of trusting a score.
#
# Kalshi only. Spends no Odds API quota. Places no order, writes no row.

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'NFL or NBA'
        required: false
        default: 'NBA'
      probe:
        description: 'How many ranked series to probe'
        required: false
        default: '200'

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography
      - name: Find the series by its markets
        env:
          PYTHONUNBUFFERED: '1'
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          FIND_LEAGUE: ${{ inputs.league }}
          NFLFIND_PROBE: ${{ inputs.probe }}
        run: python nflfind.py
