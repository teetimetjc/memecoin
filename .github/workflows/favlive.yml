name: Favlive (frozen spec, $7 bets)

# Runs the frozen narrow-slice spec against the real exchange: read the book at
# T-9, buy the 90-96c YES side at $10, hold to settlement.
#
# THE MODE INPUT IS THE SAFETY INTERLOCK AND IT DEFAULTS TO NOT SPENDING.
#
#   replay  compare the live selector against the scorer on all of history.
#           Reads only. Run this first and require zero mismatches.
#   dry     the full live loop -- real markets, real prices, real timing --
#           printing the orders it would send and sending none.
#   live    actually places orders. Sets ALLOW_LIVE_TRADING=1, which is the
#           deliberate human thumbs-up no_trade_guard.py exists to demand.
#   auto    whatever `default_mode` below says. FOR AUTOMATED CALLERS ONLY --
#           see WHY 'auto' EXISTS.
#
# SCHEDULED RUNS USE THE `default_mode` BELOW, and it is 'dry' until changed by
# hand. Flipping it is a one-line commit in this file -- which is exactly the
# property no_trade_guard was written to preserve: nothing in the code can turn
# betting on for you, and the change shows up in a diff with a date on it.
#
# THE STAKE HISTORY, because a record that cannot say what it was betting is
# a record of nothing:
#
#   $4   from 2026-10-07  the opening size
#   $7   from 2026-10-10  after 73 bets at 94.5%
#   $10  from 2026-10-11  after 105 bets at 95.2%
#   $7   from 2026-10-12  on a size hypothesis that did not hold up
#   $10  from 2026-10-12  reversed the same hour -- see below
#
# THE SIZE HYPOTHESIS HAS NO MECHANISM, and it should not have been raised.
# A buy takes the cheapest offers first and works upward, so a larger order
# sweeps UP the book and pays MORE, never less. Order size cannot produce a
# fill below the quote. The within-day split does not support it either:
#
#     Oct 10   $4 slip -1.5c  |  $7 slip -0.9c   <- larger filled BETTER
#     Oct 11   $7 slip -1.3c  |  $10 slip -4.4c  <- larger filled worse
#
# One day each way. What does hold is a trend in TIME:
#
#     slip by day   Oct 7 -0.0c  Oct 8 -0.7c  Oct 9 -1.0c
#                   Oct 10 -1.4c  Oct 11 -2.2c  Oct 12 -7.7c
#
# A market getting choppier. The cheap fills come from the price moving
# between the quote and the order landing, which happens whether the order is
# for four contracts or eleven. So the stake changes the size of each loss
# and nothing else, which is a risk choice rather than a diagnosis.
#
# WHAT ACTUALLY ADDRESSES THE BAD FILLS is MAX_DROP_CENTS below, which works
# at any stake.
#
# THE CLEAREST SINGLE EXAMPLE, from 2026-10-12 at 08:35 UTC. Three orders in
# the same close window:
#
#   DOGE  quote 92.4c -> filled 61.0c   lost
#   SOL   quote 90.0c -> filled 67.0c   lost
#   XRP   quote 94.3c -> filled 61.0c   lost
#
# -$19.39 in one minute, 61% of that day's loss. The quote said a 92%
# favourite; the price actually paid said 61%. A fill that far below the ask
# means the book had gapped down between the read and the order -- these were
# not favourites bought cheap, they were collapses bought mid-collapse. Both
# guards below would have declined all three: MAX_DROP_CENTS on the gap, and
# MAX_PER_WINDOW on the fact that three bets in one window were never three
# independent bets.
#
# AND THE RECORD AS A WHOLE IS FLAT, not falling: per-bet P&L mean -$0.008,
# t = -0.04 over 126 bets, clustered by close time. There is no downward trend
# to explain. Five days at +$30.80 and one day at -$31.76 is the entire
# history, and the guards target the day, not the drift.
#
# STANDING CAVEAT: as of this commit the account is below its starting
# balance, the record is net negative at 126 bets, and Polymarket's null over
# 4,634 bets of the same rule is unanswered. None of the stake changes above
# were verdicts that the edge is real.
#
# WHY THE NARROW SLICE AND NOT THE WIDER RULE. The expensive favourite bets the
# NO side, and buying NO means selling YES -- a mapping live.py records as an
# unconfirmed inference. Reading it backwards puts every NO bet on the wrong
# side of the market. favlive.py refuses that rule until LIVE_ALLOW_DOWN=1 is
# set, which should happen only after one NO order has been placed and the
# resulting position read back and confirmed.
#
# WHY A LONG RUN ON AN HOURLY CRON. GitHub drops scheduled triggers at roughly
# the same rate whatever the interval -- four or five a day -- so a 15-minute
# cron would miss windows wholesale. A long session on an hourly trigger with a
# concurrency group means a dropped trigger usually costs nothing: the running
# job still owns the group and the next trigger queues behind it.
#
# WHY THE SESSION IS 5h45m AND NOT 3h45m. The concurrency group only covers a
# drop that lands WHILE a job is running. A drop that lands in the gap after
# one ends is a real hole, and nothing queues to fill it. On 2026-10-08 three
# consecutive triggers dropped and the bot was off the market for 3h38m,
# missing roughly fifteen windows. Lengthening the session does not change the
# drop rate; it shrinks the target. Runner minutes are free here because the
# repository is public.
#
# WHY 'auto' EXISTS. A second, INDEPENDENT trigger source (cron-job.org
# hitting workflow_dispatch hourly at :22) is what actually closes the hole.
# An external caller can only reach workflow_dispatch, and THERE IS NO WAY TO
# SEND "no opinion" FOR A REQUIRED INPUT: omit `mode` and GitHub substitutes
# the declared default, 'dry'. The session would then run the full loop, place
# nothing, and print a log indistinguishable from a healthy live run. Sending
# mode=live instead works, but moves the live switch out of this file and into
# a third-party web form, destroying the one property that matters above --
# that spending real money is a commit with a date on it.
#
# So 'auto' means "start a session; the repository decides what kind". The
# token the pinger carries needs Actions: read and write and NOTHING ELSE --
# in particular NOT Contents, because contents write would let a leaked token
# push a workflow that prints KALSHI_API_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'replay | dry | live | auto  (live SPENDS REAL MONEY)'
        required: true
        default: 'dry'
      stake:
        description: 'dollars per bet'
        required: false
        default: '7'
      seconds:
        description: 'how long the session runs'
        required: false
        default: '20700'
      alerts:
        description: 'Pushover notifications: 1 on, 0 off'
        required: false
        default: '1'
  schedule:
    - cron: '52 * * * *'

concurrency:
  group: favlive
  cancel-in-progress: false

jobs:
  favlive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # The mode scheduled runs use. 'dry' until deliberately changed.
      #
      # RAISED TO $7 ON 2026-10-24, at the operator's decision, and this
      # DELIBERATELY BREACHES the 5%-of-bankroll rule recorded below. At a
      # ~$117.92 bankroll, 5% is $5.90; $7 is 5.94%. Recorded as an override
      # rather than edited quietly, because a sizing rule that gets silently
      # relaxed whenever it binds is not a rule.
      #
      # WHAT CHANGED THE CASE. A flat-stake replay of the whole 393-bet
      # record -- real fills, real settlements, only the size varied --
      # showed the account's TROUGH, not just its drawdown:
      #
      #     $5   final +$29.07   trough -$3.29   worst window -$13.57
      #     $7   final +$38.78   trough -$6.17   worst window -$19.39
      #     $10  final +$55.32   trough -$8.71   worst window -$28.40
      #
      # At $7 the balance never went more than $6.17 below where it started.
      # The earlier argument against stepping up rested on drawdown from
      # PEAK, which is profit given back rather than capital at risk, and
      # the bankroll was never actually threatened. The 5% rule was written
      # against the wrong quantity.
      #
      # WHAT IS STILL NOT CLAIMED. The edge remains undemonstrated: 393 bets
      # at a +1.59 point gap with the interval still containing break-even.
      # This scales a hypothesis, exactly as every previous step did. The
      # difference is that the downside is now measured rather than feared.
      #
      # AND THE $10 ERA IS NOT A COUNTEREXAMPLE TO SIZE, but it is also not
      # merely bad luck: that cohort needed only 88.8% to break even against
      # small-YES's 91.5%, meaning it bought CHEAPER entries -- fills well
      # below the quote, which won 54% against 94% for clean ones. It was
      # buying collapses. MAX_DROP_CENTS refuses those now, which is the
      # reason that era is not expected to repeat.
      #
      #
      # LOWERED TO $5 ON 2026-10-21, at the operator's decision, after
      # asking about $7 and being shown the case against it.
      #
      # THE RULE DECIDED IT, not the recent losses. 5% of a $106.14 bankroll
      # is $5.31, so $6 was 5.65% -- over the line the sizing rule sets, and
      # $7 would have been 6.6%, needing a ~$140 bankroll to qualify.
      #
      # WHAT IS NOT CLAIMED. The dashboard shows $6 as the worst stake
      # bucket -- 67 bets, 88.06% won, -$17.34 -- and $7 as the best, 26
      # bets at 96.15% and +$8.77. Neither row is about stake size. The
      # stake buckets ARE calendar periods: $7 is Oct 10-12 when everything
      # won, $6 is the last few days when little did. Stake scales an edge
      # and cannot create or destroy one, so reading those rows as a verdict
      # on size would be the same mistake the $4 -> $7 -> $10 ladder was in
      # the first week.
      #
      # THE BACKDROP, which is the real reason not to be stepping up: 322
      # bets, net +$0.18. The record peaked at +$24.63 on Oct 11 and has
      # round-tripped the whole of it. The calibration gap is +1.26 points
      # and genuinely positive, but the dollars are flat, which means the
      # losses are landing on the larger bets.
      #
      # Note this contradicts the green-day ladder recorded below, which
      # says hold after a red day rather than step down. The 5% cap is the
      # outer bound and wins where the two disagree.
      #
      # RAISED TO $6 ON 2026-10-19, under a stated sizing rule rather than a
      # feeling: step up $1 after a GREEN day, hold after a red one, and
      # never exceed 5% of the bankroll. $6 is 4.8% of $124.09, so it is the
      # largest step the rule allows tonight. All five days since the restart
      # were green.
      #
      # IT BREAKS THE $5-UNTIL-200-BETS AGREEMENT, and that is recorded here
      # rather than glossed: 109 bets in, win rate 96.33% against a 92.00%
      # break-even, gap +4.33, and a 95% interval of 90.9-98.6% that STILL
      # CONTAINS break-even. This scales a hypothesis.
      #
      # What makes it different from the $4 -> $7 -> $10 ladder of the first
      # week is only that a rule governs it. A simulation over 70 days and
      # 4,000 runs put "+$1 after a green day, hold after red" ahead of both
      # a flat stake and a fixed every-3-days ramp, and found stepping DOWN
      # after a red day actively worse -- it shrinks the stake exactly when
      # the strategy is about to revert to normal.
      #
      # RAISED TO $5 ON 2026-10-18, at the operator's decision, with the
      # measurement run half finished: 81 bets, 96.30% won against a 92.09%
      # break-even, gap +4.21, and a 95% interval of 89.7-98.7% that STILL
      # CONTAINS break-even. So this scales a hypothesis, not a result.
      #
      # It is a 25% step and was chosen over $7 deliberately. At $5 a bad
      # window costs about $9 against a $117.85 balance, and the worst day
      # since the restart goes from -$2.74 to about -$3.43. If the edge is
      # zero, the bleed is 25% faster and visible in the same 200-bet read.
      #
      # ROI is stake-independent, so the gap and the interval keep
      # accumulating exactly as before; the Versions tab timestamps the
      # boundary between the $4 era and the $5 era.
      #
      # THE AGREED CONDITION: $5 until 200 settled bets, no further step
      # before the interval resolves. The failure mode is not any single
      # increase -- it is a ladder of increases driven by a good stretch,
      # which is what $4 -> $7 -> $10 was in the first week.
      #
      # RESUMED 2026-10-14 AT $4, YES ONLY, as a measurement run. Splitting
      # the 148-bet record by stake and side against each group's OWN
      # break-even -- a winning contract pays $1, so the line is the mean
      # cost per contract -- the account loss is not spread across the
      # record, it sits in two places:
      #
      #   $4 YES    80 bets  won 95.00%  needed 91.61%  +3.4  +$10.84
      #   $7 YES    26 bets  won 96.15%  needed 91.33%  +4.8   +$8.78
      #   $10 YES   32 bets  won 81.25%  needed 88.83%  -7.6  -$24.25
      #   DOWN      10 bets  won 70.00%  needed 91.70% -21.7  -$20.60
      #
      # Small YES is +$19.62 over 106 bets at +4.3% ROI. Every dollar lost
      # is the $10 era plus DOWN.
      #
      # TWO THINGS THAT ARE NOT CLAIMED HERE. The +3.8 point gap has a 95%
      # interval of 89.4-98.0% and break-even (91.5%) is inside it, so this
      # is a sample too small to tell, not a demonstrated edge. And the $10
      # group needed only 88.8% against small YES's 91.5%, meaning it was
      # buying CHEAPER entries -- the adverse-selection problem, where fills
      # well below the quote won 54% against 94% for clean ones. So "$10 did
      # worse" is substantially "the $10 era bought different, worse bets".
      # Stake size scales an edge; it cannot create one.
      #
      # This runs to roughly 200 settled bets, which is about where a gap
      # this size either separates from break-even or does not.
      #
      # PAUSED 2026-10-13, at the operator's decision, after 148 settled
      # bets ending at -$25.29. Sessions still run, still scan and still log
      # every signal -- they place nothing.
      #
      # WHY DRY RATHER THAN DELETING THE SCHEDULE. The research value is in
      # the record, and the record only grows if the scan keeps running. A
      # dry session writes the same signals to the same sheet, so the paper
      # history of this rule continues accumulating for free while no money
      # is at risk. Deleting the cron would stop the one useful thing the
      # bot still does.
      #
      # WHAT THE EVIDENCE SAID AT THE TIME:
      #   live        148 bets   won 90.54%   needed 90.97%   -$25.29
      #   Polymarket 5,727 YES bets  +$0.012/bet  t=+0.29
      #   Polymarket 5,561 NO  bets  -$0.024/bet  t=-0.54
      #   one Polymarket week (May 11-17) was -$491 against +$426 for the
      #   other 27 combined
      #
      # Eleven thousand bets across two venues measuring an edge of zero,
      # with the result dominated by single weeks. Nothing here was broken;
      # the trade was priced correctly the whole time.
      #
      # To resume: set this back to 'live' and dispatch a fresh run, because
      # a queued run carries the workflow file as of its creation.
      default_mode: 'live'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography

      - name: Resolve the mode
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          # Empty means a schedule event, which carries no inputs at all.
          # 'auto' means a dispatch that deliberately declines to choose.
          # Both defer to default_mode; an explicit replay/dry/live wins.
          if [ -z "$M" ] || [ "$M" = "auto" ]; then M="$default_mode"; fi
          case "$M" in
            replay|dry|live) ;;
            *) echo "unknown mode: $M"; exit 1 ;;
          esac
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "Running in mode: $M  (requested: ${{ github.event.inputs.mode || 'schedule' }})"

      - name: Replay the selector against history
        if: steps.mode.outputs.mode == 'replay'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: python favreplay.py

      # Dry and live are the SAME command with the same settings. The only
      # difference is the two live switches, so a dry run exercises every line
      # the live run will, which is the point of having one.
      - name: Dry run -- places nothing
        if: steps.mode.outputs.mode == 'dry'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          BET_ALERTS: '0'
          FAVLIVE_RULE: 'narrow slice'
          FAVLIVE_STAKE: ${{ github.event.inputs.stake || '7' }}
          MIN_ENTRY_CENTS: '90'
          MAX_ENTRY_CENTS: '96'
          ORDER_PREFIX: 'slice'
        run: python favlive.py ${{ github.event.inputs.seconds || '20700' }}

      - name: LIVE -- places real orders
        if: steps.mode.outputs.mode == 'live'
        env:
          # UNBUFFERED, OR THE LOG IS USELESS WHILE IT MATTERS. Python block-
          # buffers stdout when it is a pipe rather than a terminal, so these
          # sessions wrote roughly 4KB at a time: on 2026-10-12 a whole hour of
          # scans sat in the buffer, and GitHub will not serve a job's log
          # until the job ends anyway. Between the two, the bot was
          # undiagnosable for the 5h45m that it was running -- the exact
          # window in which anyone would want to know what it was doing.
          #
          # Worse, the buffer dies with the process. Cancelling the run to read
          # the log destroyed the most recent hour instead of revealing it,
          # which is how the one question being asked (why no order against
          # two in-band signals at 16:06 UTC) ended up unanswerable.
          PYTHONUNBUFFERED: '1'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          BET_ALERTS: ${{ github.event.inputs.alerts || '1' }}
          # The two switches live.py demands, together, deliberately.
          ALLOW_LIVE_TRADING: '1'
          LIVE_TRADING: '1'
          FAVLIVE_RULE: 'narrow slice'
          FAVLIVE_STAKE: ${{ github.event.inputs.stake || '7' }}
          # BOTH SIDES, FROM 2026-10-12. The narrow slice spec is YES-only and
          # stays that way in score.RULES; this overrides the sides for the
          # live bot only, so the frozen spec still measures what it was
          # written to measure.
          #
          # WHY NOW. The DOWN mapping was the blocker and it is confirmed: one
          # real order intending NO at 91c returned outcome_side 'no',
          # position_fp -5.00, exposure $4.25. And the cost of staying YES-only
          # is measured -- replaying 2026-10-12 with both sides found 38 NO
          # signals against 8 YES ones, because in a falling market every
          # favourite is on the side the bot could not take.
          #
          # WHAT IS STILL NOT TRUE: that NO has an edge. It measured +0.03%
          # over 2,052 bets (t=0.04) and a regime-conditional re-test agreed.
          # This is running it to build a live record, not because the
          # evidence says it pays.
          # QUIET HOURS, from 2026-10-13. 04:00-11:59 UTC is 11pm-7am in
          # Chicago: the bot scans and logs that window but places nothing.
          #
          # The live record splits 46 bets at -3.95% ROI overnight against 96
          # at +1.15% for the rest of the day -- the entire account loss sits
          # in those hours. Four of the five overnight losses filled below the
          # quote, three of them in one 08:35 window at 61-67c against quotes
          # of 90-94c, and the backtest finds 11pm-3am CT negative on BOTH
          # sides, the only slice where that happens. The mechanism fits in a
          # sentence: overnight books are thin, so orders sweep further and
          # pay worse.
          #
          # Neither window is significant alone (t=+0.30 day, t=-0.43 night).
          # This acts on a mechanism plus two agreeing datasets, not on proof.
          #
          # The paper record of the skipped window is priced at the QUOTE and
          # will therefore flatter it, because the fills are what went wrong.
          # QUIET HOURS LIFTED 2026-10-15. Running around the clock.
          #
          # The pause was set on the all-stakes, all-sides split: 46 overnight
          # bets at -3.95% ROI against 96 daytime bets at +1.15%. Re-cut to
          # the configuration actually being run -- $4/$7, YES only -- the
          # overnight hours are POSITIVE:
          #
          #   overnight (11p-7a CT)  39 bets  won 94.87%  needed 91.09%  +$6.38  +3.59%
          #   daytime                80 bets  won 96.25%  needed 91.60%  +$18.16 +5.52%
          #
          # So the -$9.22 attributed to the night was DOWN bets and $10 bets
          # that happened to fall at night, not the hours themselves. Two of
          # the 39 overnight bets lost, and one of those filled at 84c against
          # a 90c quote -- the exact gap MAX_DROP_CENTS now refuses.
          #
          # THIS IS THIN AND IS NOT CLAIMED OTHERWISE: one more loss takes
          # that +3.78 gap to about +1.2. Daytime still reads better. The
          # reason to run all night is RATE, not edge -- it roughly doubles
          # the bets per day and halves the time to the 200-bet decision.
          #
          # Set this back to '4-12' to restore the pause.
          FAVLIVE_QUIET_UTC: ''
          # YES ONLY AGAIN, from 2026-10-13. The NO side ran live for about
          # eighteen hours and is switched off on the evidence, not on the
          # eighteen hours:
          #
          #   Polymarket  5,561 NO bets   -$0.024/bet   t=-0.54
          #   Kalshi      2,052 NO bets   +0.03%        t=+0.04
          #   Kalshi        256 NO bets   -$0.191/bet   (full history)
          #   live           10 NO bets   7 won         -$20.59
          #
          # The live ten decide nothing either way; seven-for-seven did not
          # make the side good on Monday and three losses do not make it bad
          # on Tuesday. What decides it is roughly eight thousand bets across
          # two venues measuring an edge of zero. Running it doubled the bet
          # count at zero expectancy, which doubles exposure to the tail week
          # that defines this strategy's risk and buys no information that
          # eight thousand bets have not already given.
          #
          # NOT AN ENDORSEMENT OF YES. The same Polymarket dataset puts the
          # YES side at +$0.012/bet, t=0.29, over 5,727 bets -- also zero.
          # This stops a known bleed; it does not turn on a winner.
          FAVLIVE_SIDES: 'YES'
          # RAISED TO $10 ON 2026-10-12, hours after being set to $4, at the
          # operator's explicit request and with the reason stated: to
          # accelerate the findings. That is a deliberate purchase of variance
          # to learn faster, not a claim that NO is now evidenced.
          #
          # IT IS STILL NOT EVIDENCED. +0.03% over 2,052 bets at t=0.04, one
          # confirmed fill, and a few dozen forward bets collected inside a
          # single falling day. Equal stakes now assert an equal confidence
          # the data does not support, and the ROI is identical at every stake
          # -- size scales whatever edge exists, including an edge of zero.
          #
          # The same sequence on the YES side, $4 -> $7 -> $10, finished the
          # day before the worst session in the record.
          FAVLIVE_STAKE_NO: '10'
          # THE STAKE LADDER. Three settled losses in a row drop the stake to
          # $4; three settled wins in a row restore it. Measured over the
          # 136-bet record normalised to flat $10, this returned +$24.13
          # against +$17.57 for no rule, and cut the worst drawdown from
          # -$40.00 to -$29.98. Drawdown-from-peak triggers were tested too
          # and did WORSE on both counts, because losses cluster -- bets in
          # one close window resolve together 23 times in 24 -- so a streak
          # fires at the bad window while a drawdown trigger fires after it
          # and then holds you small through the recovery.
          #
          # Those numbers rest on three trigger events. The direction is what
          # is trusted, not the thresholds, and they should not be retuned
          # after a bad week.
          LADDER_DOWN_AFTER: '3'
          LADDER_UP_AFTER: '3'
          # ROUGHLY HALF THE BASE STAKE. Raised 2 -> 3 on 2026-10-24
          # alongside the move to a $7 base: a $2 rung under $7 is a 71%
          # cut, far more severe than the measurement that justified the
          # ladder, which compared a half-size rung against no rule at all.
          # $3 keeps the ratio the evidence actually covered.
          LADDER_REDUCED: '3'
          # The replacement for the day stop that was switched off: a much
          # looser brake, but a brake. Measured from LADDER_START below, not
          # from the account's all-time peak.
          LADDER_HALT_DRAWDOWN: '60'
          # STARTS FROM NOW, NOT FROM THE WHOLE HISTORY. Replaying everything
          # would put the account on the reduced rung immediately -- it
          # tripped at the 08:35 window on 10-12 and never saw three wins in
          # a row afterwards -- which would have undone the stake increase
          # requested minutes earlier.
          LADDER_START: '2026-10-14T00:30:00Z'
          # Earned by that one confirmed fill, and by nothing else.
          # BACK OFF, as defence in depth rather than as the switch that
          # matters. FAVLIVE_SIDES above already stops NO signals being
          # generated; this stops live.place sending a DOWN order at all, so
          # a misread of either one is not enough on its own to bet a side
          # that measured zero across eight thousand bets.
          #
          # The mapping it originally guarded is CONFIRMED and stays
          # confirmed: one real order on 2026-10-12 intending NO at 91c
          # returned outcome_side 'no', position_fp -5.00, exposure $4.25.
          # Turning this back on needs a decision about edge, not another
          # test of the plumbing.
          LIVE_ALLOW_DOWN: '0'
          # The band must match the rule being run, or the guard rejects the
          # strategy it was asked to run. 90-96c is the narrow slice.
          MIN_ENTRY_CENTS: '90'
          MAX_ENTRY_CENTS: '96'
          ORDER_PREFIX: 'slice'
          # TWO IS THE CAP BECAUSE A WINDOW IS ONE BET, NOT THREE. Bets that
          # share a close time share an outcome: of the 24 multi-bet windows
          # in the live record, 23 resolved every leg the same way (96%). So
          # five bets in one window is one bet at five times the size, and the
          # record shows exactly that -- 1-per-window +$3.78, 3-per-window
          # -$8.47. The effective sample is 87 windows, not 126 bets, which is
          # also why the day stop trips faster than the bet count suggests.
          FAVLIVE_MAX_PER_WINDOW: '2'
          # DAY STOP OFF, at the operator's request on 2026-10-12 with the
          # day at -$40 against the $50 ceiling. They want to watch it by hand
          # rather than have the session halt itself, and to call the stop
          # themselves if it keeps going.
          #
          # WHAT THIS REMOVES: the only automatic loss limit. The funding
          # check still halts once the balance cannot cover a window, so the
          # floor is now the account balance (~$118) and not a number anyone
          # chose. The Control tab is the fast stop.
          #
          # Put a dollar figure back here to re-arm it.
          FAVLIVE_DAY_STOP: 'off'
          # The last look before each order: decline if the ask has fallen
          # more than this far since the quote the decision was made on. A buy
          # limit cannot refuse a cheap fill, so not sending is the only
          # lever. See MAX_DROP_CENTS in live.py for the evidence.
          #
          # FIVE, NOT TEN, because the damage starts well before ten. Splitting
          # the 126-bet record on how far the fill landed below the quote:
          #
          #   within 2c of quote   98 bets  95.9% won  break-even 92.3%  +$10.50
          #   more than 2c below   28 bets  78.6% won  break-even 81.3%  -$11.46
          #
          # That is the whole of the net loss, in one column. Sweeping the
          # threshold, every value from 2c to 15c leaves the kept record better
          # than the raw one -- which is why the DIRECTION is trustworthy even
          # though the exact number is not: 5c keeps 115 bets at 95.7% for
          # +$16.25, against +$12.61 at 10c, on a difference of six bets. Do
          # not read 5 as optimised; read it as "tighter than ten".
          MAX_DROP_CENTS: '5'
          # HOW FAR WE CHASE A RISING ASK, raised from 1c on 2026-10-15.
          #
          # The two guards are opposites and do not interact. MAX_DROP_CENTS
          # above fires when the ask has FALLEN -- don't buy a collapse. This
          # one binds only when the ask has RISEN -- how far to follow.
          #
          # 65 of 229 orders filled nothing because the ask moved up past a
          # limit of quote+1c. Those markets settled YES 98.4% of the time
          # (61 of 62) against a 92.7% break-even; the orders that filled won
          # 95.8%. The bot was being selected against at both ends.
          #
          # A limit is a MAXIMUM, so on a calm book this changes nothing: the
          # IOC still fills at the best offer. It only binds on the bets
          # currently being missed.
          SLIP_BUFFER_CENTS: '3'
          # And the ceiling that the buffer alone does not provide: a 95.9c
          # entry plus 3c would be a 98.9c limit, needing ~99% to break even,
          # above what even this cohort won. 97c is one cent past the band cut.
          MAX_LIMIT_CENTS: '97'
        run: python favlive.py ${{ github.event.inputs.seconds || '20700' }}
