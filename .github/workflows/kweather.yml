name: Kalshi temperature markets vs the NWS forecast (read-only)

# These markets settle on the maximum recorded "according to The Weather
# Company", NOT the NWS -- found by the probe. The buckets are ONE DEGREE
# wide, so a one-degree disagreement between providers is a whole bucket of
# error, and any edge measured against the free NWS number would mostly be
# provider disagreement.
#
# mode=basis therefore tests the premise before anything is collected: for
# each settled day it reads the YES bucket, which pins the settled value to
# a range, and compares it with the highest NWS observation at the matching
# station. 90% agreement or better makes the plan defensible; below that it
# is dead.
#
# mode=probe prints what both APIs actually return and designs nothing,
# because this project has lost days to code written against assumed field
# names (amount_cents, orderbook_fp, usdc_size, yes_bid vs yes_bid_dollars).
#
# PLACES NO ORDER. Read-only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe, basis, or collect'
        required: false
        default: 'probe'
      series:
        description: 'Series ticker for basis mode'
        required: false
        default: 'KXHIGHNY'
      days:
        description: 'How many settled days to check'
        required: false
        default: '25'

permissions:
  contents: read

jobs:
  kweather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gspread google-auth requests cryptography
      - name: Run
        env:
          PYTHONUNBUFFERED: '1'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KWEATHER_MODE: ${{ inputs.mode }}
          KWEATHER_SERIES: ${{ inputs.series }}
          KWEATHER_DAYS: ${{ inputs.days }}
        run: python kweather.py
