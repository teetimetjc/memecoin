name: T-3 live test ($3 bets)

# THE SAME RULE, SIX MINUTES LATER. lateentry, split chronologically, put
# the 90-94c band at T-3 at +3.29% net ROI in the older half and +3.13% in
# the newer one, against +0.05% and +0.26% for the same band at the T-9 the
# frozen spec enters on. A later re-measurement on a fresh pull put the
# same cell at +2.60%/+2.27%, so the estimate is drifting down and should
# be read as "under 2.3%" rather than the first number.
#
# IT IS A QUOTE RESULT AND THIS SESSION IS THE TEST OF THAT. Nothing yet
# measures whether contracts can actually be bought at T-3, where the book
# is thinner than at T-9.
#
# WHY IT PLACED NOTHING FOR A DAY, AND WHAT THAT COST. From 2026-10-22 to
# 2026-10-23 this session found in-band signals and placed none -- fifteen
# of them in five hours by the heartbeat's count. The cause was not the
# market: FAVLIVE_BAND was set to 90-94c and MIN/MAX_ENTRY_CENTS were not
# set at all, so live.py's order guard kept its 20-50c default and threw
# every signal away inside run_window as "nothing betable", BEFORE a row
# was written. No row in the sheet, and a log line identical to a quiet
# market.
#
# Both are now set and favlive refuses to start if they disagree with the
# band. The wrong lesson to draw from that day is that T-3 is rare; the
# right one is that a band has two places to be configured and only one of
# them was.
#
# THE LINE THAT MAKES THE NEXT ZERO MEAN SOMETHING: a full day of sessions
# with no bet at all is a fault to be diagnosed, not a quiet market.
#
# WHY IT IS A SEPARATE WORKFLOW RATHER THAN A SETTING. Three reasons, all
# about being able to stop one without touching the other:
#
#   Its own concurrency group. The frozen session holds 'favlive'; this
#   holds 't3live'. Neither can cancel or queue behind the other.
#
#   Its own ORDER_PREFIX. The exchange treats the two as unrelated orders.
#   Note the Live Bets sheet records the EXCHANGE's order id, not this
#   prefix, so the record is split by STAKE -- see t3check.py.
#
#   Cancelling this run stops only this, and the frozen T-9 session keeps
#   running untouched. The Control tab remains the fast stop for both.
#
# $3, NOT $5, AND ONE BET PER WINDOW. The frozen session can stake $10 in a
# window (2 x $5). Adding 1 x $3 takes the worst correlated window to about
# $13, roughly 12% of a $106 bankroll. Since legs in one window resolve
# together 96% of the time, two bets here would be one bet at double size.
#
# $3 IS ALSO THE KEY THE RECORD IS SPLIT BY, since nothing else running
# uses that size.
#
# IT YIELDS TO THE FROZEN SPEC. FAVLIVE_SKIP_HELD makes this session skip
# any market the T-9 session already holds, so one market is never held
# twice at two prices with the settlement split between them. The cost is
# that this session's sample is NOT the cohort the backtest scored -- it is
# weighted towards markets that drifted into the band late.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry | live | auto  (live SPENDS REAL MONEY)'
        required: true
        default: 'dry'
      stake:
        description: 'dollars per bet'
        required: false
        default: '3'
      seconds:
        description: 'how long the session runs'
        required: false
        default: '20700'
  schedule:
    # The same cadence as the frozen spec, so the two sessions cover the
    # same hours. The concurrency group means a trigger that lands while a
    # session is still running simply queues behind it.
    - cron: '52 * * * *'

permissions:
  contents: read

concurrency:
  group: t3live
  cancel-in-progress: false

jobs:
  t3live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # WHAT A SCHEDULED RUN DOES. A schedule carries no inputs at all, so
      # without this the mode would fall back to the dispatch default,
      # 'dry', and every scheduled session would scan, log and place
      # nothing -- producing a log almost indistinguishable from a healthy
      # live one.
      # PAUSED 2026-10-25, at the operator's decision, after 31 settled
      # bets at 87.10% won against a 93.03% break-even -- a gap of -5.93
      # and -$5.52, which is -6.38% ROI.
      #
      # IT IS 'dry' RATHER THAN A DELETED SCHEDULE, for the same reason the
      # frozen session was paused this way on 2026-10-13: the research value
      # is in the record, and the record only grows while the scan keeps
      # running. A dry session reads the same markets, finds the same
      # signals and writes the same rows; it just places nothing. Deleting
      # the cron would stop the one useful thing the test still does.
      #
      # WHAT THE 31 BETS ACTUALLY SHOWED, so this is not read later as a
      # verdict on the rule: the quote-based backtest put the T-3 band at
      # +2.3% to +3.2%, and the live fills came in at +1.61c worse than the
      # quote on average. One cent is about 1.09 points of ROI at these
      # prices, so slippage alone accounts for roughly 1.75 points -- most
      # or all of the theoretical edge. The rule may be right about the
      # prices and still unprofitable to trade, which is a different
      # finding from "the rule is wrong" and needs a different fix.
      #
      # 31 bets decides nothing either way. This stops the bleed while the
      # paper record keeps accumulating.
      #
      # To resume: set this back to 'live' and dispatch a fresh run, because
      # a queued run carries the workflow file as of its creation.
      default_mode: 'dry'
      # ONE BLOCK FOR BOTH STEPS, so the dry run exercises the live path.
      FAVLIVE_RULE: 'narrow slice'
      FAVLIVE_SIDES: 'YES'
      LIVE_ALLOW_DOWN: '0'
      FAVLIVE_QUIET_UTC: ''
      # THE WHOLE POINT: enter at T-3 instead of T-9.
      FAVLIVE_ENTRY_MIN_S: '135'
      FAVLIVE_ENTRY_MAX_S: '225'
      # THE BAND IS SET IN TWO PLACES AND BOTH ARE REQUIRED.
      #
      # FAVLIVE_BAND narrows the SELECTOR, which decides what counts as a
      # signal. MIN/MAX_ENTRY_CENTS set the ORDER GUARD inside live.py,
      # which decides what may actually be bought and defaults to the old
      # v6 range of 20-50c. Setting only the first is what made this
      # session discard fifteen in-band signals in silence.
      #
      # favlive now refuses to start when the two disagree, so this cannot
      # fail quietly again -- but they still have to be kept in step here.
      FAVLIVE_BAND: '90-94'
      MIN_ENTRY_CENTS: '90'
      MAX_ENTRY_CENTS: '94'
      FAVLIVE_MAX_PER_WINDOW: '1'
      FAVLIVE_DAY_STOP: 'off'
      FAVLIVE_SKIP_HELD: '1'
      # The guards that are earned, carried over unchanged. The drop guard
      # matters MORE here, not less: six minutes closer to close is a
      # thinner book and more room for the ask to fall between the decision
      # and the order.
      MAX_DROP_CENTS: '5'
      SLIP_BUFFER_CENTS: '3'
      # 94c band plus a 3c buffer is 97c, so the ceiling binds exactly at
      # the top of the band rather than above it.
      MAX_LIMIT_CENTS: '97'
      # LADDER EFFECTIVELY OFF. ladder.state reads settlements across the
      # whole account, so it cannot tell this strategy's results from the
      # frozen one's and would resize this bot on the other's losses. The
      # drawdown halt is kept as a real brake at $30.
      LADDER_DOWN_AFTER: '999'
      LADDER_UP_AFTER: '999'
      LADDER_REDUCED: '3'
      LADDER_HALT_DRAWDOWN: '30'
      LADDER_START: '2026-10-21T23:00:00Z'
      # This session IS the T-3 bet, so there is nothing to shadow.
      T3_SHADOW: '0'
      ORDER_PREFIX: 't3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography

      - name: Resolve the mode
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          # Empty means a schedule event, which carries no inputs.
          # 'auto' means a dispatch that deliberately declines to choose.
          if [ -z "$M" ] || [ "$M" = "auto" ]; then M="$default_mode"; fi
          case "$M" in
            dry|live) ;;
            *) echo "unknown mode: $M"; exit 1 ;;
          esac
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "Running in mode: $M  (requested: ${{ github.event.inputs.mode || 'schedule' }})"

      - name: Dry run -- places nothing
        if: steps.mode.outputs.mode == 'dry'
        env:
          PYTHONUNBUFFERED: '1'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          BET_ALERTS: '0'
          FAVLIVE_STAKE: ${{ github.event.inputs.stake || '3' }}
        run: python favlive.py ${{ github.event.inputs.seconds || '20700' }}

      - name: LIVE -- places real orders
        if: steps.mode.outputs.mode == 'live'
        env:
          PYTHONUNBUFFERED: '1'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          BET_ALERTS: '1'
          # The two switches live.py demands, together, deliberately.
          ALLOW_LIVE_TRADING: '1'
          LIVE_TRADING: '1'
          FAVLIVE_STAKE: ${{ github.event.inputs.stake || '3' }}
        run: python favlive.py ${{ github.event.inputs.seconds || '20700' }}
