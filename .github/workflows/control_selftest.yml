name: Control Self-Test

# Proves the halt switch works, and can set the per-bet stake.
#
# With no input it reads the Control tab, reads the balance, runs the funding
# check at 1/3/5 signals, HALTS, confirms the halt stuck, then resumes -- and
# sends one real Pushover notification so the alert path is proven.
#
# With a `stake` input it instead writes that stake to the Control tab. The tab
# stays the source of truth; this just saves editing the cell by hand.
#
# Manual only. No orders either way: control.py issues one signed GET for the
# balance and otherwise touches only the spreadsheet.

on:
  workflow_dispatch:
    inputs:
      stake:
        description: "Dollars per bet to write to the Control tab (blank = run the self-test instead)"
        required: false
        default: ""

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests gspread google-auth cryptography

      - name: Control self-test or set stake
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          if [ -n "${{ inputs.stake }}" ]; then
            python control.py --stake "${{ inputs.stake }}"
          else
            python control.py
          fi
