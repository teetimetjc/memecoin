name: Which venue does each series trade on (read-only)

# The halt at 03:20 UTC: Kalshi refused a $5 XRP order for insufficient
# balance while the balance read $99.29. The breakdown shows all of it on
# exchange_index 0, and KXXRP15M carries exchange_index 2.
#
# This answers whether the live T-9 strategy can place any order at all.
#
# Signed GETs only. Places nothing, changes no setting, clears no halt.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  venuechk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography
      - name: Map series to venues
        env:
          PYTHONUNBUFFERED: '1'
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: python venuechk.py
