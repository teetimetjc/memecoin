name: 88-90c shadow (PAPER ONLY -- never places an order)

# WHY THIS EXISTS. bandsweep measured the band edges on 18,116 markets of
# historical quotes at T-9, with the live 90-96c band as a gating control:
#
#   0.88-0.89    201 markets   +2.04% net ROI   halves +0.40% / +4.02%
#   0.89-0.90    197 markets   +1.31% net ROI   halves +2.92% / -0.49%
#   0.90-0.96 *  1376 markets  +1.36% net ROI   halves +1.49% / +1.22%
#   0.96-0.97    146 markets   under the 150 floor, no verdict
#   0.97-0.98    108 markets   under the 150 floor, no verdict
#
# 88-89c cleared all four pre-registered tests. It is NOT being bet, and
# the reason is the row under it: 89-90c, the cent sitting BETWEEN 88-89c
# and the live band, flipped sign between halves.
#
# THERE IS NO MECHANISM FOR THAT PATTERN. A market that misprices 88-89c,
# prices 89-90c correctly, and then misprices 90-96c again is not a market,
# it is a coincidence. Prices do not work in stripes. One of those three
# rows is noise, and the cheapest candidate is the one whose older half is
# +0.40% -- positive by a rounding error, with the whole result riding on a
# +4.02% newer half of about a hundred markets.
#
# The four tests were the right tests and 88-89c passed them. The adjacency
# check was not one of them and should have been. This session is how that
# gets tested on data it was not found in.
#
# THE TOP END IS CLOSED, not pending. 96-97c and 97-98c are too thin to
# judge -- 146 and 108 markets out of 18,116 -- and the arithmetic settles
# it anyway: at 96.5c a win pays about 3.6% against a ~0.25% fee, so
# break-even sits near 96.74%, a margin of roughly a quarter of a cent.
# Measured slippage in the live record is larger than that margin. There is
# no shadow for the top end because there is nothing there to shadow.
#
#
# THERE IS NO LIVE STEP IN THIS FILE, AND THAT IS THE DESIGN.
#
# Not a mode input that defaults to dry -- no live step exists at all.
# ALLOW_LIVE_TRADING and LIVE_TRADING appear nowhere here, and no Pushover
# secret is passed, so there is nothing to flip and nothing to alert on. A
# mis-dispatch, a wrong input, or a leaked Actions token with workflow
# dispatch cannot make this session spend a cent.
#
# Turning it on later means ADDING a step in a reviewable commit with a
# date on it, which is exactly the property the frozen session's mode
# interlock was written to preserve.
#
#
# THE PASS CONDITION, written down before the rows exist so it cannot be
# quietly loosened once they do. All three, together:
#
#   1. About 100 settled paper bets. Fewer decides nothing.
#   2. Net ROI positive against THIS cohort's own mean cost per contract.
#      A winning contract pays exactly $1, so the mean cost is the hurdle;
#      the midpoint of the band would flatter every row.
#   3. 88-89c AND 89-90c both positive. This is the adjacency test and it
#      is the whole point of the session.
#
# FAILING (3) IS A STOP, not an invitation to pool the two cents together
# until the sign comes back. Pooling after seeing the split is how a noise
# result gets laundered into a finding.
#
# AND EVEN A CLEAN PASS IS NOT AN ORDER. These are quotes plus paper fills.
# Whether six contracts actually sit at the ask at 88c -- a thinner part of
# the book than 90-96c -- is a DEPTH question that nothing here measures.
# The T-3 test is the standing warning: its quote-based edge was real and
# its fills came in 1.61c worse, which at these prices is about 1.75 ROI
# points, most or all of the edge. A rule can be right about prices and
# still unprofitable to trade.
#
#
# WHY $5 AND 2 PER WINDOW. Both match the live session exactly, so this
# reads as a preview of what switching it on would have done rather than a
# separate experiment with its own confounds. The paper P&L is directly
# comparable to the live $5 record.
#
# WHY THE LADDER IS OFF. ladder.state reads settlements across the whole
# account and cannot tell this session's paper bets from the live session's
# real ones, so it would resize a paper bot on real losses. The same
# reasoning switched it off for t3live.
#
# WHY SKIP_HELD IS OFF. The bands do not overlap -- 88-90c against the live
# 90-96c -- so there is no market both sessions can want, and nothing is
# held here in any case. Leaving it off keeps the sample unbiased, which is
# the thing the T-3 session had to give up.
#
# IF THIS EVER GAINS A LIVE STEP, SKIP_HELD MUST GO BACK TO 1 in the same
# commit, or one market can be held twice with the settlement split.
#
#
# A DAY OF SESSIONS WITH ZERO ROWS IS A FAULT, NOT A QUIET MARKET. The T-3
# session found fifteen in-band signals in five hours and placed none of
# them, silently, because FAVLIVE_BAND was set and MIN/MAX_ENTRY_CENTS were
# not -- live.py's order guard kept its old 20-50c default and discarded
# every signal inside run_window BEFORE a row was written. No row, and a log
# line identical to a quiet market.
#
# The band is therefore set in BOTH places below, and favlive refuses to
# start if the two disagree. If this session logs nothing for a day, read
# that as broken and diagnose it.
#
# Reads the book and writes paper rows to the sheet. Places no order.

on:
  workflow_dispatch:
    inputs:
      stake:
        description: 'paper dollars per bet (record only -- nothing is spent)'
        required: false
        default: '5'
      seconds:
        description: 'how long the session runs'
        required: false
        default: '20700'
  schedule:
    # The same cadence as the live sessions, so the shadow covers the same
    # hours and the comparison is not a comparison of clocks.
    - cron: '52 * * * *'

permissions:
  contents: read

concurrency:
  # Its own group. Cancelling or queueing this cannot touch favlive, oillive
  # or t3live, and none of them can queue behind it.
  group: lowshadow
  cancel-in-progress: false

jobs:
  lowshadow:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography

      # THE ONLY STEP. There is deliberately no live counterpart.
      - name: Shadow the 88-90c band -- places nothing, ever
        env:
          # Unbuffered, or an in-flight session is undiagnosable: Python
          # block-buffers stdout to a pipe, GitHub will not serve a running
          # job's log, and the buffer dies with the process.
          PYTHONUNBUFFERED: '1'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          # No Pushover secrets are passed at all. A paper session has
          # nothing to alert about, and a token not present cannot leak.
          BET_ALERTS: '0'
          FAVLIVE_RULE: 'narrow slice'
          FAVLIVE_SIDES: 'YES'
          LIVE_ALLOW_DOWN: '0'
          FAVLIVE_QUIET_UTC: ''
          # T-9, the same entry offset as the frozen session. The band is
          # the only thing being varied -- changing the offset too would
          # make a failure unattributable.
          # THE BAND, IN BOTH PLACES IT HAS TO BE SET.
          # FAVLIVE_BAND narrows the SELECTOR (what counts as a signal).
          # MIN/MAX_ENTRY_CENTS set live.py's ORDER GUARD (what may be
          # bought at all). Setting only the first is what made the T-3
          # session discard fifteen in-band signals in silence.
          FAVLIVE_BAND: '88-90'
          MIN_ENTRY_CENTS: '88'
          MAX_ENTRY_CENTS: '90'
          FAVLIVE_STAKE: ${{ github.event.inputs.stake || '5' }}
          # Matching the live session, so this previews it.
          FAVLIVE_MAX_PER_WINDOW: '2'
          FAVLIVE_DAY_STOP: 'off'
          FAVLIVE_SKIP_HELD: '0'
          # The earned guards, carried over unchanged. The drop guard
          # matters at least as much here: 88c is a thinner part of the
          # book than 90-96c, so there is more room for the ask to fall
          # between the decision and the order.
          MAX_DROP_CENTS: '5'
          SLIP_BUFFER_CENTS: '3'
          # 90c band plus a 3c buffer is 93c, so the ceiling binds exactly
          # at the top of this band rather than above it.
          MAX_LIMIT_CENTS: '93'
          # Ladder off -- it cannot tell paper bets from real ones.
          LADDER_DOWN_AFTER: '999'
          LADDER_UP_AFTER: '999'
          LADDER_REDUCED: '3'
          LADDER_HALT_DRAWDOWN: '30'
          LADDER_START: '2026-10-26T04:30:00Z'
          T3_SHADOW: '0'
          # The Strategy column writes this, which is how the record is
          # split back out later. Nothing else running uses 'low'.
          ORDER_PREFIX: 'low'
        run: python favlive.py ${{ github.event.inputs.seconds || '20700' }}
