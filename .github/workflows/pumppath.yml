name: Record pump.fun price paths (read-only, no wallet)

# Takes a cohort of fresh launches from the FREE websocket subscription,
# then polls each one's bonding curve account on a public Solana RPC and
# records the price at a fixed set of ages. No API key anywhere.
#
# WHY NOT THE TRADE STREAM: pumpportal paywalls subscribeTokenTrade. The
# curve account is the same information, free, and pricesrc verified the
# decode against the websocket's own figures to nine significant figures.
#
# One getMultipleAccounts call covers the whole cohort per poll, so a
# cohort of forty costs the same as one.

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long the session runs'
        required: false
        default: '20700'
      cohort:
        description: 'How many launches to follow'
        required: false
        default: '40'
      recruit:
        description: 'Seconds spent collecting the cohort'
        required: false
        default: '600'
      rpcs:
        description: 'Comma-separated Solana RPC URLs'
        required: false
        default: 'https://api.mainnet-beta.solana.com'

permissions:
  contents: read

concurrency:
  group: pumppath
  cancel-in-progress: false

jobs:
  pumppath:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets gspread google-auth requests
      - name: Record price paths
        env:
          PYTHONUNBUFFERED: '1'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          PUMPPATH_SECONDS: ${{ inputs.seconds || '20700' }}
          PUMPPATH_COHORT: ${{ inputs.cohort || '40' }}
          PUMPPATH_RECRUIT: ${{ inputs.recruit || '600' }}
          SOLANA_RPCS: ${{ inputs.rpcs || 'https://api.mainnet-beta.solana.com' }}
        run: python pumppath.py
