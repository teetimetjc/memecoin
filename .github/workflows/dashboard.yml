name: Dashboard Data

# Rebuilds dashboard/equity_data.js from the Predictions tab and commits it, so
# the published chart can be refreshed without exporting the workbook by hand.
#
# Deliberately SEPARATE from the predictor workflow. Collection runs every 15
# minutes and must not be at risk from anything here: a failure in this job
# leaves a stale data file and nothing else.
#
# TRIGGERED BY THE "Refresh v6 dashboard" Routine, not by cron.
#
# GitHub's scheduler does not fire for this repo -- predictor.yml carries no
# cron either and every one of its runs is a workflow_dispatch from outside.
# The schedule below was added on that assumption and never ran; it is kept
# only as a fallback in case scheduling is ever enabled here. Do not rely on
# it. The Routine dispatches this workflow, waits for it to finish, then
# republishes the artifact.

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"        # inert on this repo -- see above

permissions:
  contents: write

concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests gspread google-auth cryptography numpy

      - name: Build dashboard payload
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python dashboard_data.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- dashboard/equity_data.js; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/equity_data.js
          git commit -m "Refresh dashboard data [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin claude/meme-coin-scanner-fixes-uai1dj && \
            git push origin HEAD:claude/meme-coin-scanner-fixes-uai1dj && exit 0
            echo "push failed, retrying in $((2**i))s"
            sleep $((2**i))
          done
          echo "could not push after 4 attempts"
          exit 1
