name: Pump.fun graduation rate (read-only)

# Joins launches to migrations on mint and reports the graduation rate
# corrected three ways: graduations of tokens we never saw launch, launches
# too young to have graduated, and stretches where the collector was not
# listening. Reads launch and migration events only -- never the price tab,
# whose reserve decode has an unexplained defect.
#
# Places no order, writes no row, uses no wallet.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pumpjoin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gspread google-auth requests
      - name: Join
        env:
          PYTHONUNBUFFERED: '1'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python pumpjoin.py
