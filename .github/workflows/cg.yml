name: CG Experiments (read-only)

# The numbered experiments from the external review. Each one reads the
# sheet, prints a result, and writes nothing.
#
# CG0 is not here: it is the settlement fetch, which writes a tab, and it
# lives in settle_fetch.yml. CG1 through CG5 depend on it having run,
# because they all need a settlement outcome that is not our own
# arithmetic.
#
# CG7 and CG9 do NOT depend on it, and that is the point of them: one asks
# whether YES and NO can both be bought for under a dollar, the other
# whether a contract's price move predicts its next price move. Neither
# uses a settlement outcome at all, so neither could have been damaged by
# the flag that turned out to be 19% wrong.
#
# v6 is the re-grade of the original forward test against that same
# authoritative result. It is the one case here that writes anything: it
# tops up the Settled tab before scoring, because a re-grade run against a
# half-filled tab silently drops the oldest signals and reports what is
# left as though it were the whole sample.
#
# maker asks the one question none of the above touch: whether RESTING an
# order collects more than it gives up, rather than crossing the spread.
# maker-holdout is a deliberately separate dispatch so that the held-back
# last 20% of windows cannot be reached by re-running the ordinary case.
# It stays unrun until a specification is frozen in writing.
#
# probe-auth asked which of two explanations was true for the paper bots'
# empty market data. Answer: neither credentials nor the query -- Kalshi
# changed the response shape. Signed and unsigned replies were identical.
#
# probe-ws asks the same question of the market-data SOCKET, which is a
# different endpoint and may not share the REST answer. It decides whether
# EdgeHunter needs a key at all, and is deliberately run BEFORE any secret
# is handed to third-party code.
#
# kap prints the Kapelame paper ledger priced as a real $10 bet, and tops
# up settlements FIRST. The other order shows the newest session's trades
# as open, which looks like a bot that stopped rather than a settlement tab
# that has not caught up.
#
# survey-probe looks at the REST OF THE EXCHANGE. Every strategy tested so
# far has been on 15-minute crypto, the highest-frequency and most
# bot-saturated market Kalshi runs; that it is efficient says nothing about
# weather, indices or daily crypto. The probe asks what exists, where the
# volume is, and whether a settled market keeps its last price -- which
# decides whether calibration across history is an afternoon or a month.
#
# Read-only otherwise -- no order path is reachable from this workflow.

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'survey-probe | kap | cg1 | cg7 | cg9 | v6 | maker | maker-holdout (FROZEN SPEC ONLY) | probe-auth | probe-ws'
        required: true
        default: 'survey-probe'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography websockets
      - name: Run the experiment
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: |
          case "${{ inputs.experiment }}" in
            cg1) python cg1.py ;;
            cg7) python cg7.py ;;
            cg9) python cg9.py ;;
            all) python cg7.py; echo; python cg9.py ;;
            v6)  python settle_fetch.py; echo; python v6_regrade.py ;;
            maker) python maker.py ;;
            maker-holdout) python maker.py --holdout ;;
            probe-auth) python probe_auth.py ;;
            probe-ws) python probe_ws.py ;;
            kap) python settle_fetch.py; echo; python kap_table.py ;;
            survey-probe) python survey_probe.py ;;
            *)   echo "unknown experiment: ${{ inputs.experiment }}"; exit 1 ;;
          esac
