name: Paper Bots (EdgeHunter + Kapelame)

# Runs the two third-party paper-trading bots and lands whatever they
# produce in their own sheet tabs.
#
# WHY HERE AND NOT LOCALLY: the development sandbox blocks
# api.elections.kalshi.com, api.coinbase.com, ws.kraken.com and
# stream.binance.com, so both bots are mute there. A runner has open
# egress, which makes this the only place they can actually collect.
#
# PAPER ONLY. Neither bot's runnable code can place an order: EdgeHunter
# defines LiveExecutionEngine and never instantiates it, and Kapelame's
# paper_trader.py contains no order path at all. Both are re-checked at
# runtime below and the job FAILS rather than proceeding. trader.py, which
# is a real live trader with an empty strategy stub, is never invoked.
#
# CREDENTIALS GO TO EDGEHUNTER ONLY, because that is where they were
# measured to be necessary. probe_auth showed Kalshi's REST endpoints
# return identical data signed and unsigned -- the order book is fully
# public -- so Kapelame needs nothing and is given nothing. probe_ws then
# showed the market-data SOCKET is different: HTTP 401 unsigned, full
# orderbook stream when signed. EdgeHunter reads its key unconditionally at
# startup, so without it the feed never opens and no price ever arrives.
#
# PUSHOVER goes to both, because paper outcomes were invisible until an
# export hours later. One message per bet as it settles, each one saying it
# is paper and that no real money was staked. Pushover cannot place an
# order, so this widens nothing. BOT_ALERTS=0 silences it.
#
# THE CLONES ARE PINNED to commits audited on 2026-09-22, whose only
# outbound hosts are Kalshi and Coinbase and which never log the key or its
# headers. Tracking a default branch would mean whatever the owners push
# next runs here, with credentials, unreviewed.
#
# 1h55m ON A TWO HOUR CRON, for the same reason collect15.yml went hourly:
# the four-hour trigger was not firing. Against slots of 07:07, 11:07,
# 15:07, 19:07, 23:07 what actually ran on Sep 27 was 05:09, 13:51, 19:43
# and 22:57 -- four a day instead of six, each tens of minutes late.
# Scheduled workflows are best-effort on shared runners and get dropped
# under load, so the fix is to shorten the exposure to any single missed
# trigger and let the concurrency group queue a late one behind the job in
# progress.
#
# WHY TWO HOURS HERE AND ONE HOUR THERE. Every restart re-clones both bots
# and rebuilds a virtualenv, xgboost included, before a single price
# arrives, and each bot then needs some minutes of feed before it has the
# history to produce a signal at all. The collector pays none of that: it
# is useful in its first fifteen seconds. Paying that setup twelve times a
# day instead of twenty-four keeps the warmup tax near 3% while still
# cutting a dropped trigger's cost from four hours to two.
#
# The older tension is unchanged and still respected: too long and the
# schedule owns the concurrency group continuously, which is how a dispatch
# once sat "pending" with no jobs and no explanation. 1h55m in a two-hour
# slot leaves five minutes of clear air to dispatch into.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long each bot runs (600 = 10min check, 6900 = 1h55m session)'
        required: true
        default: '6900'
      alerts:
        description: 'Pushover on each paper settlement (1 = on, 0 = off)'
        required: false
        default: '1'
  schedule:
    - cron: '7 */2 * * *'

concurrency:
  group: paper-bots
  cancel-in-progress: false

env:
  EDGEHUNTER_SHA: da357972950d0094c883ef34aa5172b5ecc7c60a
  KAPELAME_SHA: eb129b4fe2fe9a05d8e9f5439e7a97a8e77ae550

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        bot: [edgehunter, kapelame]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests gspread google-auth cryptography

      - name: Clone the bot at a pinned, audited commit
        run: |
          set -e
          mkdir -p bots && cd bots
          if [ "${{ matrix.bot }}" = "edgehunter" ]; then
            url=https://github.com/Franzi317/EdgeHunter.git
            dir=EdgeHunter; want=$EDGEHUNTER_SHA
          else
            url=https://github.com/kapelame/kalshi-crypto-bot.git
            dir=kalshi-crypto-bot; want=$KAPELAME_SHA
          fi
          git clone --quiet "$url" "$dir"
          cd "$dir"
          git checkout --quiet "$want"
          got=$(git rev-parse HEAD)
          if [ "$got" != "$want" ]; then
            echo "::error::pinned $want but got $got"; exit 1
          fi
          echo "pinned at $got"

      - name: Install (with the deps upstream forgot to declare)
        run: |
          set -e
          if [ "${{ matrix.bot }}" = "edgehunter" ]; then
            cd bots/EdgeHunter
            python -m venv .venv
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt
            # NOT optional: without xgboost the pricer degrades silently to a
            # zero-confidence echo and the bot takes no trades, ever.
            .venv/bin/pip install -q xgboost
            cp -n .env.example .env || true
            # Assert rather than hope. A warning in a log is not a check.
            .venv/bin/python -c "from model.xgboost_pricer import XGBoostPricer as X; p = X(); assert p._loaded, 'xgboost model did NOT load -- bot would take zero trades'; print('model loaded OK')"
          else
            cd bots/kalshi-crypto-bot
            python -m venv .venv
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt
            .venv/bin/pip install -q nest_asyncio
          fi

      - name: Patch Kapelame's market reads for the current Kalshi API
        if: matrix.bot == 'kapelame'
        run: python patch_kapelame.py bots/kalshi-crypto-bot/paper_trader.py

      - name: Confirm no live order path is reachable
        run: |
          if [ "${{ matrix.bot }}" = "edgehunter" ]; then
            cd bots/EdgeHunter
            if grep -rn "LiveExecutionEngine(" --include=*.py . ; then
              echo "::error::LiveExecutionEngine is CONSTRUCTED somewhere - refusing to run"
              exit 1
            fi
            echo "OK: LiveExecutionEngine defined but never instantiated"
          else
            cd bots/kalshi-crypto-bot
            if grep -n "portfolio/orders" paper_trader.py ; then
              echo "::error::paper_trader.py contains an order path - refusing to run"
              exit 1
            fi
            echo "OK: paper_trader.py has no order path"
          fi

      # KALSHI_* reaches the edgehunter leg only. botrun.py holds the
      # matching allowlist and strips those vars for every other bot, so if
      # the two ever disagree the bot receives nothing rather than silently
      # inheriting a key it was never measured to need. Pushover goes to
      # both: it reports outcomes and cannot place an order.
      - name: Run EdgeHunter (signed feed) and log to the sheet
        if: matrix.bot == 'edgehunter'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          BOT_ALERTS: ${{ github.event.inputs.alerts || '1' }}
        run: |
          python botrun.py edgehunter ${{ github.event.inputs.seconds || '6900' }}

      - name: Run Kapelame (public data, no credentials) and log to the sheet
        if: matrix.bot == 'kapelame'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          BOT_ALERTS: ${{ github.event.inputs.alerts || '1' }}
        run: |
          python botrun.py kapelame ${{ github.event.inputs.seconds || '6900' }}
