name: Collect 15-Minute Markets

# Runs collect15.py, which samples every Kalshi fifteen-minute market at
# roughly 14, 12, 9, 6, 3 and 1 minutes before it closes and records what
# the exchange said, plus the settlement Kalshi itself reports.
#
# WHY IT RUNS HERE. The sandbox blocks api.elections.kalshi.com, so a
# collector is mute there. A runner has open egress.
#
# WHAT IT DOES NOT HAVE. No Pushover secret is reachable from this
# workflow. Collection must not be able to buzz a phone: an alert naming a
# market is a prompt to bet one by hand, and nothing collected here has
# been tested yet. It also places no orders -- the script contains no order
# path at all, which the guard step re-checks rather than assumes.
#
# 3h45m ON AN HOURLY CRON -- BOTH NUMBERS, AND THE COMBINATION IS THE POINT.
#
# The first attempt at this fix shortened the run to 59 minutes and made
# coverage WORSE: 60% became 17%. The reasoning was that hourly triggers
# would cover for dropped ones. They did not, because GitHub drops them at
# the same rate whatever the interval -- against 24 hourly slots on Sep 29 it
# fired FOUR times: 02:19, 09:05, 16:09, 21:04. Four runs of 59 minutes is
# four hours of collection a day. Four runs of 3h45m is fifteen.
#
# So the duration goes back to 3h45m and the hourly cron STAYS. The
# concurrency group is what makes the pair work: a trigger arriving during a
# run queues instead of vanishing, and starts the moment that run ends. With
# a trigger offered every hour there is nearly always one pending, so the
# handoff happens immediately rather than waiting for a slot GitHub might
# skip. Long runs give the coverage; frequent triggers make the next one
# certain.
#
# THE ORIGINAL DIAGNOSIS STILL STANDS, and it was never the script.
#
# This used to be 3h45m on a four-hour cron, which should have covered 94%
# of windows. It covered 60%. The collector was not at fault: of 1,773 rows
# collected over two days, 1,663 carried all six offsets. When it is awake
# it catches everything.
#
# Against a cron of 00:22, 04:22, 08:22, 12:22, 16:22, 20:22, the runs that
# actually fired were:
#
#   Sep 26   05:09  13:13  19:15  22:58
#   Sep 27   05:26  14:05  19:48  23:08
#
# Four a day instead of six, none within 45 minutes of its slot. Scheduled
# workflows are best-effort on shared runners and are dropped under load.
# Run 13 ended 08:54 and the next did not start until 13:13, which is
# precisely the dark block 09:00-13:00 in the collected data.
#
# Minute 48 is deliberate: the top of the hour is when the fleet is busiest
# and a trigger is likeliest to be dropped.
#
# SEAM ALIGNMENT IS ABANDONED ON PURPOSE. 3h45m from a start GitHub chooses
# lands the seam wherever it likes, and the previous version's careful
# arithmetic about ending just after a :45 close bought one window an hour
# while the schedule was losing eleven. One window at each handoff loses its
# T-14 sample and is picked up by the next run from T-12, so it is a row
# with five offsets rather than a row that does not exist.
#
# THE SHORT RUN MATTERS. `seconds: 600` collects roughly one window and is
# the right first move after any change to the script. Four of this
# project's failures were response shapes that had quietly moved --
# orderbook to orderbook_fp, last_price to last_price_dollars -- and each
# one produced a well-formed tab full of blanks rather than an error. Ten
# minutes answers that; an overnight session answers it far too late.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long to collect (600 = one-window check, 13500 = 3h45m session)'
        required: true
        default: '13500'
  schedule:
    - cron: '48 * * * *'

concurrency:
  group: collect15
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread google-auth cryptography

      - name: Confirm no order path is reachable
        run: |
          if grep -n "portfolio/orders\|def place_order\|create_order" collect15.py ; then
            echo "::error::collect15.py contains an order path - refusing to run"
            exit 1
          fi
          echo "OK: collect15.py has no order path"

      - name: Collect
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: python collect15.py ${{ github.event.inputs.seconds || '13500' }}
