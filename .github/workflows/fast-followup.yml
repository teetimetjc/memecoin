name: Meme Coin Fast Follow-up (1-min)

on:
  workflow_dispatch:

jobs:
  fast-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests colorama gspread google-auth pytz

      - name: Run fast follow-up
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python memecoinscanner.py --fast-followup
