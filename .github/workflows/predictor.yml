name: Crypto Predictor

on:
  workflow_dispatch:

# Needed only by the dashboard step at the very end, which commits
# dashboard/equity_data.js. Collection itself writes nothing to the repo.
permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests gspread google-auth cryptography

      # --- spending gate ---------------------------------------------------
      # FIRST, and allowed to fail the job. Scans the files this workflow can
      # execute for anything that could place a Kalshi order, and blocks the
      # run unless ALLOW_LIVE_TRADING says that is intended.
      #
      # It is set to "1" below, so live betting IS authorised. To revoke that,
      # set it to "0": the guard then blocks any order path and the run stops
      # before collection, which is the safe direction to fail.
      - name: No-trade guard
        env:
          ALLOW_LIVE_TRADING: "1"
        run: python no_trade_guard.py

      - name: Generate predictions
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          # Step 2: log the order each signal WOULD send, to the "Dry Run" tab.
          # Kept running alongside live betting so the intended fill and the
          # real one can be reconciled from the sheet.
          DRY_RUN_ORDERS: "1"
          # LIVE BETTING. Real money. Both of these must be "1", the Control
          # tab must read RUNNING, and the entry must be under 50c -- live.py
          # re-checks all of it. Set either to "0" to stop betting at the next
          # run; set the Control tab to HALTED to stop immediately.
          LIVE_TRADING: "1"
          ALLOW_LIVE_TRADING: "1"
          # DOWN bets. Sent as an ask on the YES contract, which should open a
          # NO position -- standard, but inferred rather than documented, so
          # live.py reads positions back after every fill and prints the
          # direction it actually got. Set to "0" to go back to UP-only.
          LIVE_ALLOW_DOWN: "1"
        run: python predictor.py
      - name: Resolve outcomes
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python predictor.py --resolve
      - name: Refresh Report tab
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python predictor.py --report --sheet

      # --- hourly pulse ----------------------------------------------------
      # One summary per hour: bets placed, dollars staked, balance, state.
      # Not one message per bet -- at ~90 bets a day that would be unreadable.
      # Rides on this workflow for the same reason the dashboard does: this
      # repo's cron never fires, but this workflow demonstrably runs.
      - name: Hourly pulse
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          if [ "$(date -u +%M)" -ge 15 ]; then
            echo "Not the top of the hour; no pulse."
            exit 0
          fi
          python -c "import predictor as P, live; live.pulse(P._get_client())"

      # --- dashboard data -------------------------------------------------
      # LAST, and continue-on-error, so nothing below can affect collection:
      # every step that touches the sheet has already succeeded by this point,
      # and a failure here is reported without failing the run.
      #
      # It lives here rather than in its own scheduled workflow because
      # GitHub's cron does not fire on this repo -- dashboard.yml's schedule
      # never ran once. This workflow demonstrably runs every 15 minutes, so
      # the dashboard rides along with it. dashboard.yml is kept for manual
      # rebuilds.
      #
      # Only every 4th run (on the hour) to keep repo churn sane: the chart is
      # for watching multi-day trends, not 15-minute ones.
      - name: Rebuild dashboard data
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ "$(date -u +%M)" -ge 15 ]; then
            echo "Not the top of the hour; skipping dashboard rebuild."
            exit 0
          fi
          python dashboard_data.py
          if git diff --quiet -- dashboard/equity_data.js; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/equity_data.js
          git commit -m "Refresh dashboard data [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin claude/meme-coin-scanner-fixes-uai1dj && \
            git push origin HEAD:claude/meme-coin-scanner-fixes-uai1dj && exit 0
            echo "push failed, retrying in $((2**i))s"; sleep $((2**i))
          done
          echo "could not push dashboard data after 3 attempts"
