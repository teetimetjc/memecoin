name: Kalshi Probe

# Confirms the API key works against the authenticated portfolio endpoints,
# and -- with mode: find-order-endpoint -- discovers which order path is
# current after the documented one started returning HTTP 410.
#
# MANUAL ONLY. There is deliberately no schedule.
#
# Neither mode can place a real order. The default mode issues GETs
# exclusively. The discovery mode posts a ticker that cannot exist, so a live
# path rejects it on validation and a wrong path 404s -- there is no market to
# fill against, by construction.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "credentials | find-order-endpoint | listing-timeline | min-order | why-blocked | find-market-url"
        required: false
        default: "credentials"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/meme-coin-scanner-fixes-uai1dj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests gspread google-auth cryptography

      - name: Probe
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_KEY_ID:  ${{ secrets.KALSHI_KEY_ID }}
        run: |
          case "${{ inputs.mode }}" in
            find-order-endpoint) python kalshi_probe.py --find-order-endpoint ;;
            listing-timeline)    python kalshi_probe.py --listing-timeline ;;
            min-order)           python kalshi_probe.py --min-order ;;
            why-blocked)         python kalshi_probe.py --why-blocked ;;
            find-market-url)     python kalshi_probe.py --find-market-url ;;
            exchange-index)      python kalshi_probe.py --exchange-index ;;
            fills)               python kalshi_probe.py --fills ;;
            order-types)         python kalshi_probe.py --order-types ;;
            *)                   python kalshi_probe.py ;;
          esac
