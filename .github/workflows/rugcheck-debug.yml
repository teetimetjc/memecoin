name: Rugcheck API Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Probe Rugcheck /report endpoint
        run: |
          python3 - <<'EOF'
          import requests, json

          addresses = [
              "DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263",  # BONK
              "EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm",  # WIF
          ]

          for addr in addresses:
              print(f"\n{'='*60}")
              print(f"Address: {addr}")
              url = f"https://api.rugcheck.xyz/v1/tokens/{addr}/report"
              try:
                  r = requests.get(url, timeout=15)
                  print(f"Status: {r.status_code}")
                  if r.status_code == 200:
                      data = r.json()
                      print(f"Top-level keys: {list(data.keys())}")
                      print(f"score: {data.get('score')}")
                      print(f"lpLockedPct (top-level): {data.get('lpLockedPct')}")

                      th = data.get('topHolders')
                      print(f"topHolders: {type(th).__name__}, len={len(th) if isinstance(th, list) else 'N/A'}")
                      if isinstance(th, list) and th:
                          print(f"  [0] keys: {list(th[0].keys())}")
                          print(f"  [0] pct:  {th[0].get('pct')}")
                          total = sum(h.get('pct',0) for h in th[:10])
                          print(f"  top10 sum pct: {total}")

                      mk = data.get('markets')
                      print(f"markets: {type(mk).__name__}, len={len(mk) if isinstance(mk, list) else 'N/A'}")
                      if isinstance(mk, list) and mk:
                          lp = mk[0].get('lp')
                          print(f"  markets[0].lp: {json.dumps(lp, indent=2) if lp else lp}")
                  else:
                      print(f"Body: {r.text[:500]}")
              except Exception as e:
                  print(f"Error: {e}")
          EOF
